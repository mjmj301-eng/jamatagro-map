name: Deploy to GitHub Pages

# Publishes the site on every push to the default branch — "save (push) = live".
# One-time: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [ main ]        # change to "master" if that is your default branch
  workflow_dispatch:           # lets you re-deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site (whole repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
