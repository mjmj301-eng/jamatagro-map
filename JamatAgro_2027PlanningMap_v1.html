<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JamatAgro — 2027 Planning Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#15311f}
  header{background:#15311f;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header b{font-size:16px} header .sub{font-size:12px;color:#b6c7bd}
  header .prog{margin-left:auto;font-size:12px;font-weight:700;background:#2a5b3f;color:#cfe9da;border-radius:20px;padding:4px 11px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#20412e;padding:8px 14px}
  .bar label{font-size:11px;color:#cfe0d7;display:flex;flex-direction:column;gap:3px}
  .bar select,.bar input{font:inherit;font-size:14px;padding:7px 8px;border:1px solid #3a6b4d;border-radius:7px;background:#163826;color:#fff;min-height:38px}
  .bar .btn{font:inherit;font-size:13px;border:1px solid #cfe9da;background:#fff;color:#15311f;border-radius:8px;padding:8px 11px;cursor:pointer;min-height:38px}
  .bar .btn.ghost{background:transparent;color:#fff}
  #wrap{position:relative;height:calc(100vh - 46px - 54px);min-height:420px}
  #map{position:absolute;inset:0;background:#e9efe9}
  .plotlabel{background:transparent;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000}
  .legend{position:absolute;right:10px;bottom:10px;z-index:500;background:#fff;border:1px solid #d8e0d8;border-radius:10px;padding:9px 11px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);max-width:190px}
  .legend h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#5d6b63}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
  .legend .sw.todo{background:repeating-linear-gradient(45deg,#cfd8d2,#cfd8d2 3px,#fff 3px,#fff 6px)}
  /* bottom-sheet editor */
  #editor{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-top:3px solid #15311f;box-shadow:0 -4px 18px rgba(0,0,0,.22);transform:translateY(110%);transition:transform .2s ease;max-height:86vh;overflow:auto}
  #editor.open{transform:translateY(0)}
  .ed-in{max-width:620px;margin:0 auto;padding:14px 16px 20px}
  .ed-in h3{margin:2px 0 2px;font-size:17px}
  .ed-now{font-size:13px;color:#5d6b63;margin-bottom:10px}
  .ed-grid{display:flex;flex-wrap:wrap;gap:12px}
  .ed-grid label{display:flex;flex-direction:column;font-size:12px;color:#5d6b63;gap:4px}
  .ed-grid input,.ed-grid select{font:inherit;font-size:16px;padding:10px;border:1px solid #c3cdc6;border-radius:8px;min-height:46px}
  .ed-same{display:flex;align-items:center;gap:8px;font-size:15px;margin:10px 0;color:#15311f}
  .ed-same input{width:22px;height:22px}
  .ed-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .ed-actions .btn{font:inherit;font-size:15px;border-radius:9px;padding:12px 16px;cursor:pointer;min-height:48px;border:1px solid #15311f}
  .ed-actions .save{background:#15311f;color:#fff;flex:1}
  .ed-actions .cancel{background:#fff;color:#15311f}
  .ed-actions .clear{background:#fff;color:#b4271b;border-color:#b4271b;margin-left:auto}
  .hint{font-size:12px;color:#6b7a72}
  @media(max-width:560px){ .bar{gap:6px} .bar label{flex:1 1 44%} .ed-grid label{flex:1 1 100%} }
</style>
</head>
<body>
<header>
  <b>🌱 JamatAgro — 2027 Planning Map</b>
  <span class="sub">tap a plot → set next year's crop</span>
  <span class="prog" id="prog">0 of 0 confirmed</span>
</header>
<div class="bar">
  <label>Show manager<select id="focus"><option value="">Everyone</option></select></label>
  <label>Find plot<input id="search" type="search" placeholder="plot no…" style="width:110px"></label>
  <label class="chk" style="flex-direction:row;align-items:center;gap:6px;color:#cfe0d7;font-size:13px;align-self:end"><input type="checkbox" id="sat"> Satellite</label>
  <span style="flex:1"></span>
  <button class="btn" id="exportcsv">⬇ Export plan (CSV)</button>
  <button class="btn" id="copywa">📋 Copy WhatsApp summary</button>
  <button class="btn ghost" id="reset">Reset</button>
</div>
<div id="wrap">
  <div id="map"></div>
  <div class="legend" id="legend"></div>
</div>

<div id="editor">
  <div class="ed-in">
    <h3 id="ed-title">Plot</h3>
    <div class="ed-now" id="ed-now"></div>
    <label class="ed-same"><input type="checkbox" id="ed-same"> Same as now (no change for 2027)</label>
    <div class="ed-grid" id="ed-fields">
      <label>2027 crop<select id="ed-crop"></select></label>
      <label>Area<input id="ed-area" type="number" step="0.1" placeholder="e.g. 3"></label>
      <label>Unit<select id="ed-unit"><option value="acres">acres</option><option value="ha">hectares</option></select></label>
      <label>Planting month<select id="ed-month"></select></label>
      <label>Manager<select id="ed-mgr"></select></label>
      <label>Intercrop (if any)<input id="ed-inter" placeholder="e.g. cassava under palm"></label>
      <label style="flex:1 1 100%">Notes<input id="ed-notes" placeholder="optional"></label>
    </div>
    <div class="ed-actions">
      <button class="btn save" id="ed-save">✓ Confirm plot</button>
      <button class="btn cancel" id="ed-cancel">Cancel</button>
      <button class="btn clear" id="ed-clear">Clear</button>
    </div>
    <div class="hint">Confirmed plots fill solid on the map. Dashed = still to confirm.</div>
  </div>
</div>

var FOCUS="";
function styleFor(p){
  var pf=planFor(p), conf=!!(PLAN[p]&&PLAN[p].confirmed);
  var col=CROPCOL[pf.crop]||"#cfd8d2";
  var dim=FOCUS && (ATTR[p]||{}).manager!==FOCUS;
  return {color:conf?"#15311f":"#7f988a",weight:conf?1.8:1,dashArray:conf?null:"4 3",fillColor:col,fillOpacity:dim?0.07:(conf?0.72:0.28)};
}
var geoLayer=L.geoJSON(GEO,{style:function(f){return styleFor(f.properties.plot_no);},onEachFeature:function(f,l){
  var p=f.properties.plot_no;
  l.on("click",function(){openEditor(p);});
  l.bindTooltip(String(p),{permanent:true,direction:"center",className:"plotlabel"});
}}).addTo(map);
try{map.fitBounds(geoLayer.getBounds(),{padding:[20,20]});}catch(e){map.setView([7.2426,4.0297],15);}
function recolor(){geoLayer.eachLayer(function(l){l.setStyle(styleFor(l.feature.properties.plot_no));});}

/* legend + progress */
(function(){var h='<h4>2027 crop</h4>';CROPS.forEach(function(c){h+='<div class="row"><span class="sw" style="background:'+CROPCOL[c]+'"></span>'+c+'</div>';});h+='<div class="row"><span class="sw todo"></span>to confirm</div>';el("legend").innerHTML=h;})();
function total(){return geoLayer.getLayers().length;}
function updateProgress(){var n=Object.keys(PLAN).filter(function(k){return PLAN[k].confirmed;}).length;el("prog").textContent=n+" of "+total()+" confirmed";}

/* editor */
(function fill(){
  var c=el("ed-crop");CROPS.forEach(function(x){var o=document.createElement("option");o.value=x;o.textContent=x;c.appendChild(o);});
  var m=el("ed-month");MONTHS.forEach(function(x){var o=document.createElement("option");o.value=x;o.textContent=x;m.appendChild(o);});
  var g=el("ed-mgr");[""].concat(MANAGERS,["Other"]).forEach(function(x){var o=document.createElement("option");o.value=x;o.textContent=x||"(unassigned)";g.appendChild(o);});
  var f=el("focus");MANAGERS.forEach(function(x){var o=document.createElement("option");o.value=x;o.textContent=x;f.appendChild(o);});
})();
var CUR=null;
function toggleSame(){var s=el("ed-same").checked;["ed-crop","ed-area","ed-unit","ed-month","ed-inter"].forEach(function(id){el(id).disabled=s;el(id).style.opacity=s?0.45:1;});}
el("ed-same").addEventListener("change",toggleSame);
function openEditor(p){
  CUR=p;var a=ATTR[p]||{},pf=planFor(p);
  el("ed-title").textContent="Plot "+p;
  el("ed-now").textContent="Now: "+((a.current_use||"—"))+(a.vintage_year?(" · vintage "+a.vintage_year):"")+(a.manager?(" · "+a.manager):"");
  el("ed-same").checked=!!pf.same && !pf.crop ? true : (pf.same===undefined?false:!!pf.same);
  el("ed-crop").value=pf.crop||suggestedCrop(p)||"Other";
  el("ed-area").value=pf.area||"";
  el("ed-unit").value=pf.unit||"acres";
  el("ed-month").value=pf.month||"— no change —";
  el("ed-mgr").value=pf.manager||a.manager||"";
  el("ed-inter").value=pf.intercrop||"";
  el("ed-notes").value=pf.notes||"";
  toggleSame();
  el("editor").classList.add("open");
}
function closeEditor(){el("editor").classList.remove("open");CUR=null;}
el("ed-cancel").addEventListener("click",closeEditor);
el("ed-save").addEventListener("click",function(){
  if(CUR==null)return;var p=CUR,same=el("ed-same").checked;
  PLAN[p]={ same:same, crop:same?((ATTR[p]||{}).current_use||el("ed-crop").value):el("ed-crop").value,
    area:same?"":el("ed-area").value, unit:el("ed-unit").value, month:same?"":el("ed-month").value,
    manager:el("ed-mgr").value, intercrop:same?"":el("ed-inter").value, notes:el("ed-notes").value, confirmed:true };
  persist();recolor();updateProgress();closeEditor();
});
el("ed-clear").addEventListener("click",function(){ if(CUR!=null){delete PLAN[CUR];persist();recolor();updateProgress();closeEditor();} });

/* controls */
el("focus").addEventListener("change",function(){FOCUS=this.value;recolor();});
el("search").addEventListener("change",function(){var v=parseInt(this.value);if(isNaN(v))return;geoLayer.eachLayer(function(l){if(l.feature.properties.plot_no===v){map.fitBounds(l.getBounds(),{maxZoom:19});openEditor(v);}});});
el("reset").addEventListener("click",function(){if(!Object.keys(PLAN).length)return;if(confirm("Clear all 2027 plan entries on this device?")){PLAN={};persist();recolor();updateProgress();}});

/* exports */
function areaHa(pl){var a=parseFloat(pl.area);if(isNaN(a))return"";return (pl.unit==="ha"?a:a/2.471).toFixed(2);}
el("exportcsv").addEventListener("click",function(){
  var cols=["plot_no","use_2026","vintage_year","manager_2027","area_ha","plan_2027","planting_month_2027","intercrop_2027","notes"];
  var lines=[cols.join(",")];
  Object.keys(PLAN).filter(function(k){return PLAN[k].confirmed;}).sort(function(a,b){return a-b;}).forEach(function(p){
    var pl=PLAN[p],a=ATTR[p]||{};
    var row=[p,a.current_use||"",a.vintage_year||"",pl.manager||a.manager||"",areaHa(pl),pl.crop||"",pl.same?"same as now":(pl.month||""),pl.intercrop||"",pl.notes||""];
    lines.push(row.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(","));
  });
  var blob=new Blob([lines.join("\n")+"\n"],{type:"text/csv"});var u=URL.createObjectURL(blob);var dl=document.createElement("a");dl.href=u;dl.download="JamatAgro_2027Plan_"+(FOCUS?FOCUS.replace(/[^a-z0-9]/gi,"_"):"all")+".csv";dl.click();
});
el("copywa").addEventListener("click",function(){
  var byMgr={};
  Object.keys(PLAN).filter(function(k){return PLAN[k].confirmed;}).sort(function(a,b){return a-b;}).forEach(function(p){
    var pl=PLAN[p];var m=pl.manager||(ATTR[p]||{}).manager||"(unassigned)";(byMgr[m]=byMgr[m]||[]).push({p:p,pl:pl});});
  var out="JamatAgro — 2027 plan\n";
  Object.keys(byMgr).forEach(function(m){out+="\n"+m+"\n";byMgr[m].forEach(function(x){var pl=x.pl;
    out+=pl.same?(x.p+" – "+(pl.crop||(ATTR[x.p]||{}).current_use)+" – same as now\n")
                :(x.p+" – "+(pl.crop||"?")+(pl.area?(" – "+pl.area+" "+pl.unit):"")+(pl.month?(" – plant "+pl.month):"")+(pl.intercrop?(" – intercrop "+pl.intercrop):"")+"\n");});});
  var n=Object.keys(PLAN).filter(function(k){return PLAN[k].confirmed;}).length;out+="\n("+n+" of "+total()+" plots confirmed)";
  var ta=document.createElement("textarea");ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(out);document.body.removeChild(ta);
  this.textContent="Copied ✓";var self=this;setTimeout(function(){self.textContent="📋 Copy WhatsApp summary";},1300);
});

recolor();updateProgress();
</script></body></html>
