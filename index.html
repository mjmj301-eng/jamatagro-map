<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JamatAgro — Farm Map Viewer (v7)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a2b22}
  header{padding:9px 16px;background:#1a2b22;color:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700}
  header span{font-size:11px;color:#b6c7bd}
  .wrap{display:flex;height:calc(100vh - 42px);min-height:480px;position:relative}
  #menuBtn{display:none;background:none;border:1px solid #3a4a41;color:#fff;font-size:17px;line-height:1;border-radius:6px;padding:3px 9px;cursor:pointer}
  #backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:1100}
  aside{width:262px;background:#fff;border-right:1px solid #dfe5e0;overflow-y:auto;padding:13px}
  @media(max-width:800px){
    #menuBtn{display:inline-block}
    aside#side{position:absolute;top:0;left:0;height:100%;width:80%;max-width:320px;transform:translateX(-100%);transition:transform .25s ease;z-index:1200;box-shadow:2px 0 14px rgba(0,0,0,.3)}
    aside#side.open{transform:translateX(0)}
  }
  aside h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#5d6b63;margin:15px 0 6px}
  aside h2:first-child{margin-top:0}
  select,input[type=search]{width:100%;padding:7px;border:1px solid #cfd8c5;border-radius:6px;font-size:13px}
  .btn{display:block;width:100%;text-align:center;padding:7px;border:1px solid #cfd8c5;border-radius:6px;background:#f4f6f4;font-size:12px;cursor:pointer;margin-top:6px}
  .btn:hover{background:#eef2ee}
  label.ck{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:4px 0;cursor:pointer}
  #map{flex:1;background:#eef1ee}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
  .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
  .plotlabel{background:transparent;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000}
  .status{font-size:11px;color:#5d6b63;margin-top:8px;line-height:1.5}
  .leaflet-popup-content{font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<header>
  <button id="menuBtn" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <h1>🌱 JamatAgro — Farm Map Viewer</h1>
  <span id="hdr">Demo — load your traced geometry to see the real farm</span>
</header>
<div class="wrap">
  <div id="backdrop" onclick="toggleMenu(false)"></div>
  <aside id="side">
    <h2>Colour plots by</h2>
    <select id="mode" onchange="render()">
      <option value="use">Current land use</option>
      <option value="vintage">Oil-palm vintage (year)</option>
      <option value="manager">Manager</option>
      <option value="cleared">Cleared status</option>
      <option value="zone">Initial allocation zone</option>
      <option value="calendar">📅 Calendar status</option>
    </select>

    <h2>Legend</h2>
    <div id="legend"></div>

    <h2>Operations layers</h2>
    <label class="ck"><input type="checkbox" id="ck_act" checked onchange="render()"> Work done</label>
    <label class="ck"><input type="checkbox" id="ck_inc" checked onchange="render()"> Incidents</label>
    <select id="days" onchange="render()" style="margin-top:5px">
      <option value="99999">All time</option>
      <option value="30">Last 30 days</option>
      <option value="7">Last 7 days</option>
    </select>

    <h2>View</h2>
    <label class="ck"><input type="checkbox" id="ck_lite" checked onchange="liteChanged()"> Lite (no imagery — saves data)</label>
    <label class="ck"><input type="checkbox" id="ck_street" onchange="setBase()"> Street map instead of satellite</label>
    <label class="ck"><input type="checkbox" id="ck_see" onchange="seeThrough()"> See-through plots over satellite</label>
    <label class="ck" style="gap:6px">Plot fill <input type="range" id="fill" min="0" max="100" value="80" oninput="setFill(this.value)" style="flex:1"></label>

    <h2>Find plot</h2>
    <input type="search" id="find" placeholder="Plot number…" oninput="findPlot(this.value)">

    <h2>Data</h2>
    <label class="btn">📐 Load geometry (.geojson / .json)<input type="file" accept=".geojson,.json" style="display:none" onchange="loadGeom(this.files[0])"></label>
    <label class="btn">📋 Load attributes (.csv)<input type="file" accept=".csv" style="display:none" onchange="loadCsv(this.files[0],'attr')"></label>
    <label class="btn">🗒 Load activity (.csv)<input type="file" accept=".csv" style="display:none" onchange="loadCsv(this.files[0],'act')"></label>
    <a class="btn" href="Calendar/JamatAgro_PlanningViews_v4.html" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">📅 Open Farm Calendar (planner)</a>
    <div class="status" id="status"></div>
  </aside>
  <div id="map"></div>
</div>

<!-- Shared data sources (single source of truth for both map & planner) -->
<script src="Calendar/JamatAgro_DataSources_v1.js"></script>
<!-- Farm Calendar engine (inlined, read-only overlay) -->
<script>
/*
 * JamatAgro Farm Calendar — Generation Engine v2
 * Adds recurring / seasonal / window task types, labour effort, date-range generation,
 * provisional second anchors, ad-hoc planned activities, and manager re-assignment —
 * while preserving the v1 guarantees (stable occurrence_index; plan_start_date bound).
 *
 * generate({ templates, cycles, taskLog, plots, plotUse, today, rangeStart, rangeEnd })
 *   -> { today, rangeStart, rangeEnd, occurrences, validation }
 *
 * occurrence_index is computed from each task's intrinsic origin (NOT the view range),
 * so it is stable no matter which window you render — completions never re-key.
 */
var JamatCal = (function () {
  'use strict';

  function parseDate(s){ if(!s) return null; var p=String(s).slice(0,10).split('-'); if(p.length<3) return null; var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return isNaN(d.getTime())?null:d; }
  function iso(d){ return d.toISOString().slice(0,10); }
  function addDays(d,n){ var x=new Date(d.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; }
  function diffDays(a,b){ return Math.round((a.getTime()-b.getTime())/86400000); }
  function ymd(y,m,day){ return new Date(Date.UTC(y,m-1,day||1)); }
  function parseVintageYear(v){ var m=String(v==null?'':v).match(/\d{4}/); return m?+m[0]:null; }

  function csvParse(text){ var rows=[],row=[],field='',i=0,inQ=false,c; text=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    for(i=0;i<text.length;i++){ c=text[i];
      if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=c; }
      else if(c==='"') inQ=true; else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else field+=c; }
    if(field.length||row.length){ row.push(field); rows.push(row); } if(!rows.length) return [];
    var head=rows.shift().map(function(h){return h.trim();});
    return rows.filter(function(r){return r.some(function(x){return x!=='';});})
      .map(function(r){ var o={}; head.forEach(function(h,j){ o[h]=(r[j]==null?'':r[j]).trim(); }); return o; }); }

  function indexTemplates(t){ var b={}; (t||[]).forEach(function(x){ b[x.template_id+'@'+x.version]=x; }); return b; }

  function inferPhase(tp, age, ov){ if(ov) return ov;
    for(var k=0;k<tp.phases.length;k++){ var ph=tp.phases[k]; var lo=ph.entry?ph.entry.offset_days:-Infinity; var hi=ph.exit?ph.exit.offset_days:Infinity; if(age>=lo && age<hi) return ph.phase_id; }
    var last=tp.phases[tp.phases.length-1]; if(last && !last.exit && age>=(last.entry?last.entry.offset_days:0)) return last.phase_id; return null; }

  function effectiveEvents(log){ var m={}; (log||[]).forEach(function(e){ if(e.action==='adhoc_created'||e.action==='assigned') return; var k=e.cycle_id+'|'+e.task_code+'|'+e.occurrence_index; if(!m[k]||String(e.event_ts)>String(m[k].event_ts)) m[k]=e; }); return m; }
  // assignment is a distinct event so it never overwrites a done/shifted status
  function assignments(log){ var m={}; (log||[]).forEach(function(e){ if(e.action!=='assigned') return; var k=e.cycle_id+'|'+e.task_code+'|'+e.occurrence_index; if(!m[k]||String(e.event_ts)>String(m[k].event_ts)) m[k]=e.manager||e.adhoc_manager||''; }); return m; }

  function validateCycle(c, byKey, plotSet, plotUse){ var errs=[];
    if(plotSet && !plotSet.has(String(c.plot_no))) errs.push('plot_no '+c.plot_no+' not found in register/geometry');
    var tk=(c.template_version && c.template_version.indexOf('@')>=0)?c.template_version:null;
    if(!tk || !byKey[tk]){ errs.push('template_version "'+c.template_version+'" not found'); }
    else { var t=byKey[tk];
      if(c.crop && t.crop_name && c.crop!==t.crop_name) errs.push('crop "'+c.crop+'" != template crop "'+t.crop_name+'"');
      if(plotUse && plotUse[c.plot_no] && t.maps_to_current_use && plotUse[c.plot_no]!==t.maps_to_current_use)
        errs.push('plot land-use "'+plotUse[c.plot_no]+'" incompatible with template use "'+t.maps_to_current_use+'"');
      if(c.anchor_type && t.anchors.indexOf(c.anchor_type)<0) errs.push('anchor_type "'+c.anchor_type+'" not in template anchors');
    }
    if(!parseDate(c.anchor_date)) errs.push('anchor_date "'+c.anchor_date+'" invalid');
    return errs; }

  // resolve primary + sets_anchor (actual) + provisional second anchors
  function resolveAnchors(cycle, tp, eff){ var a={};
    a[cycle.anchor_type]={date:parseDate(cycle.anchor_date), status:cycle.anchor_status||'planned'};
    tp.tasks.forEach(function(t){ if(!t.sets_anchor) return;
      for(var k in eff){ var e=eff[k]; if(e.cycle_id===cycle.cycle_id && e.task_code===t.task_code && e.action==='done' && e.done_date){ a[t.sets_anchor]={date:parseDate(e.done_date), status:'actual', source:e.entry_id}; } } });
    // provisional for any declared anchor still unresolved
    (tp.anchors||[]).forEach(function(an){ if(a[an]) return;
      var setter=tp.tasks.filter(function(t){return t.sets_anchor===an;})[0];
      if(setter && a[setter.anchor] && a[setter.anchor].date){ a[an]={date:addDays(a[setter.anchor].date, setter.offset_days||0), status:'provisional'}; } });
    return a; }

  function labourFor(task, area){ var A=parseFloat(area); if(!isNaN(A) && task.labour_per_ha!=null) return Math.round(A*task.labour_per_ha*10)/10; if(task.labour_days!=null) return task.labour_days; return null; }

  // expand one task to occurrences [{occurrence_index, date, end_date?}] up to rangeEnd.
  // primaryDate = the cycle's primary-anchor date (used as the base year for seasonal tasks,
  // which are month-anchored and carry no `anchor` field).
  function expandTask(task, anchors, primaryDate, rangeEnd){ var out=[], CAP=6000;
    if(task.type==='seasonal'){ var baseY=primaryDate.getUTCFullYear(); var months=(task.months||[]).slice(); var endY=rangeEnd.getUTCFullYear();
      for(var Y=baseY; Y<=endY; Y++){ for(var mi=0; mi<months.length; mi++){ var d2=ymd(Y, months[mi], task.day||1); if(d2.getTime()>rangeEnd.getTime()) continue; out.push({occurrence_index:(Y-baseY)*months.length+mi, date:d2}); } }
      return out; }
    var a=anchors[task.anchor]; if(!a||!a.date) return out;
    if(task.type==='offset'){ out.push({occurrence_index:0, date:addDays(a.date, task.offset_days||0)}); }
    else if(task.type==='window'){ out.push({occurrence_index:0, date:addDays(a.date, task.start_offset_days||0), end_date:addDays(a.date, task.end_offset_days||0)}); }
    else if(task.type==='recurring'){ var first=addDays(a.date, task.active_from_days||0); var last=(task.active_to_days!=null)?addDays(a.date, task.active_to_days):rangeEnd;
      var k=0, d=first; while(d.getTime()<=last.getTime() && d.getTime()<=rangeEnd.getTime() && k<CAP){ out.push({occurrence_index:k, date:d}); k++; d=addDays(first, k*(task.interval_days||1)); } }
    return out; }

  // v3 status model — separates "not reported" (silence) from "overdue" (genuinely late),
  // and treats a task still inside its tolerance window as on-time.
  //   windowEnd = end_date (window tasks) OR planned + window_days.
  function classify(sched, windowEnd, today, critical){
    if(today.getTime() < sched.getTime()) return diffDays(sched,today)<=7 ? 'due_soon' : 'upcoming';
    if(today.getTime() <= windowEnd.getTime()) return 'in_window';   // past nominal date but still inside tolerance
    return critical ? 'overdue' : 'not_reported';                    // past tolerance, no event
  }

  function generate(opts){ opts=opts||{};
    var today=opts.today?parseDate(opts.today):parseDate(iso(new Date()));
    var byKey=indexTemplates(opts.templates);
    var plotSet=opts.plots?new Set(opts.plots.map(String)):null;
    var plotUse=opts.plotUse||null;
    var eff=effectiveEvents(opts.taskLog||[]);
    var asg=assignments(opts.taskLog||[]);
    var rangeEnd=opts.rangeEnd?parseDate(opts.rangeEnd):addDays(today,420);
    var rangeStartOpt=opts.rangeStart?parseDate(opts.rangeStart):null;
    var validation=[], occ=[];

    (opts.cycles||[]).forEach(function(c){
      var errs=validateCycle(c, byKey, plotSet, plotUse);
      if(errs.length){ validation.push({cycle_id:c.cycle_id, plot_no:c.plot_no, errors:errs}); return; }
      if(['planned','active'].indexOf(c.status)<0) return;
      var t=byKey[c.template_version];
      var anchors=resolveAnchors(c, t, eff);
      var primary=anchors[c.anchor_type]; if(!primary||!primary.date) return;
      var planStart=parseDate(c.plan_start_date)||primary.date;
      // no-flood lower bound; overview mode (year view) bypasses plan_start but is still
      // bounded to the requested range, so at most one screen's worth of history appears.
      var lowBound = opts.ignorePlanStart ? (rangeStartOpt||planStart)
        : (rangeStartOpt && rangeStartOpt.getTime()>planStart.getTime() ? rangeStartOpt : planStart);

      t.tasks.forEach(function(task){
        expandTask(task, anchors, primary.date, rangeEnd).forEach(function(o){
          // no-flood + range filters (index already assigned from intrinsic origin -> stable)
          if(o.date.getTime()<lowBound.getTime()) return;
          if(o.date.getTime()>rangeEnd.getTime()) return;
          // phase gate evaluated at the OCCURRENCE date (handles multi-year perennials)
          if(task.phase){ var ageAt=diffDays(o.date, primary.date); if(inferPhase(t, ageAt, c.phase_override||'')!==task.phase) return; }
          var key=c.cycle_id+'|'+task.task_code+'|'+o.occurrence_index;
          var e=eff[key]; var sched=o.date, status, dd=null, delta=null;
          var mgr=asg[key]||c.manager||'(unassigned)';
          if(e && e.action==='skipped'){ status='skipped'; }
          else if(e && e.action==='done'){ status='done'; dd=parseDate(e.done_date); if(dd) delta=diffDays(dd,o.date); }
          else {
            if(e && e.action==='shifted' && e.new_date){ var nd=parseDate(e.new_date); if(nd) sched=nd; }
            var winEnd = o.end_date ? o.end_date : addDays(sched, task.window_days||0);
            status=classify(sched, winEnd, today, !!task.critical);
          }
          var winEndOut = o.end_date ? o.end_date : addDays(sched, task.window_days||0);
          occ.push({ cycle_id:c.cycle_id, plot_no:c.plot_no, crop:c.crop, manager:mgr, field_label:task.field_label||'', phase:task.phase||inferPhase(t, diffDays(o.date,primary.date), c.phase_override||''),
            task_code:task.task_code, label:task.label, category:task.category, activity_detail:task.activity_detail||'', type:task.type,
            occurrence_index:o.occurrence_index, planned_date:iso(o.date), scheduled_date:iso(sched), end_date:o.end_date?iso(o.end_date):'', window_end:iso(winEndOut),
            window_days:task.window_days||0, inputs:task.inputs||'', labour_days:labourFor(task, c.area_ha), critical:!!task.critical,
            status:status, done_date:dd?iso(dd):'', delta_days:delta, anchor_status:primary.status, area_ha:c.area_ha||'', adhoc:false,
            pattern:(opts.ignorePlanStart && o.date.getTime()<planStart.getTime()) });
        });
      });
    });

    // ad-hoc planned activities (rows with action 'adhoc_created')
    (opts.taskLog||[]).forEach(function(e){ if(e.action!=='adhoc_created') return;
      var d=parseDate(e.new_date)||parseDate(e.scheduled_date); if(!d) return;
      if(rangeStartOpt && d.getTime()<rangeStartOpt.getTime()) return; if(d.getTime()>rangeEnd.getTime()) return;
      var key=(e.cycle_id||'FARM')+'|'+e.entry_id+'|0'; var ov=eff[key]; var status, dd=null, sched=d;
      if(ov && ov.action==='skipped') status='skipped'; else if(ov && ov.action==='done'){ status='done'; dd=parseDate(ov.done_date); }
      else { if(ov && ov.action==='shifted' && ov.new_date){ var nd=parseDate(ov.new_date); if(nd) sched=nd; } status=classify(sched, sched, today, false); }
      occ.push({ cycle_id:e.cycle_id||'', plot_no:e.adhoc_plot_no||'', crop:'(ad-hoc)', field_label:e.adhoc_label||'', manager:asg[key]||e.adhoc_manager||'(unassigned)',
        phase:'', task_code:e.entry_id, label:e.adhoc_label||e.notes||'Ad-hoc task', category:e.adhoc_category||'other', activity_detail:'', type:'adhoc',
        occurrence_index:0, planned_date:iso(d), scheduled_date:iso(sched), end_date:'', window_days:0, inputs:'', labour_days:(e.adhoc_labour_days!=null&&e.adhoc_labour_days!=='')?+e.adhoc_labour_days:null,
        critical:false, status:status, done_date:dd?iso(dd):'', delta_days:null, anchor_status:'planned', area_ha:'', adhoc:true });
    });

    // recurring-run grouping (stable within the returned range) so the UI can collapse a run
    var runs={};
    occ.forEach(function(o){ if(o.type!=='recurring')return; var rid=o.cycle_id+'|'+o.task_code; (runs[rid]=runs[rid]||[]).push(o); });
    Object.keys(runs).forEach(function(rid){ var arr=runs[rid].sort(function(a,b){return a.scheduled_date<b.scheduled_date?-1:1;}); arr.forEach(function(o,i){ o.run_id=rid; o.run_index=i; o.run_total=arr.length; }); });

    occ.sort(function(a,b){ return a.scheduled_date<b.scheduled_date?-1:a.scheduled_date>b.scheduled_date?1:0; });
    return { today:iso(today), rangeStart:rangeStartOpt?iso(rangeStartOpt):'', rangeEnd:iso(rangeEnd), occurrences:occ, validation:validation };
  }

  // Suggested completions from the existing activity log (spec P0-7). Matches open occurrences on
  // plot_no + activity_detail + date within tolerance; nearest-date tie-break; multi-cycle -> ambiguous.
  function autoMatch(activity, occurrences, tolDays){
    tolDays = (tolDays==null)?5:tolDays;
    var open = (occurrences||[]).filter(function(o){ return o.status!=='done' && o.status!=='skipped' && !o.adhoc; });
    var sug=[];
    (activity||[]).forEach(function(a,ai){
      var type=String(a.type||'').toLowerCase(); if(type.indexOf('incident')>=0) return;
      var detail=String(a.detail||'').trim().toLowerCase(); var ad=parseDate(a.date); if(!detail||!ad) return;
      var plot=String(a.plot_no);
      var cand=open.filter(function(o){ return String(o.plot_no)===plot && String(o.activity_detail||'').toLowerCase()===detail && Math.abs(diffDays(parseDate(o.scheduled_date),ad))<=tolDays; });
      if(!cand.length) return;
      cand.sort(function(x,y){ return Math.abs(diffDays(parseDate(x.scheduled_date),ad))-Math.abs(diffDays(parseDate(y.scheduled_date),ad)); });
      var cycles={}; cand.forEach(function(o){ cycles[o.cycle_id]=1; });
      var ambiguous=Object.keys(cycles).length>1;
      sug.push({ activity_index:ai, date:a.date, by:a.by||'', detail:a.detail, plot_no:a.plot_no, ambiguous:ambiguous, candidates:cand, chosen: ambiguous?null:cand[0] });
    });
    return sug;
  }

  return { parseDate:parseDate, iso:iso, addDays:addDays, diffDays:diffDays, csvParse:csvParse, parseVintageYear:parseVintageYear, inferPhase:inferPhase, generate:generate, autoMatch:autoMatch };
})();
if (typeof module!=='undefined' && module.exports) module.exports=JamatCal;

</script>

<script>
/* ============================================================
   LIVE GOOGLE SHEET MODE (optional)
   After you publish each sheet (File ▸ Share ▸ Publish to web ▸ CSV),
   paste the two CSV links here. Leave blank to use the Load buttons.
   ============================================================ */
// Data sources come from the shared config (Calendar/JamatAgro_DataSources_v1.js); repo files are the fallback.
const _S = window.JAMAT_SRC || {};
const REGISTER_CSV_URL = _S.REGISTER_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQiWG52Sc_IqsEvbf0AmNOYmCW8Wof88elt79zvPtfcq0rHSX4Sfv8w41ZYOTJsbVdKDYvxjxpjM7hs/pub?output=csv';   // JamatAgro Plot Register
const ACTIVITY_CSV_URL = _S.ACTIVITY_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS68ealVuRhDHEksYgnngTfS3BlUa07rHQa0lhGIUzSWO2UleVy3bgyD1ZfDTCYhy1FycR3hdYUN5_L/pub?output=csv';   // JamatAgro Activity Log (Google Form)
const GEOMETRY_URL     = 'JamatAgro_PlotGeometry.geojson';   // sits next to this file in the repo; auto-loads when hosted
// --- Farm Calendar module (read-only overlay). Cycles/Task-log use the shared Sheet URLs when set, else repo CSVs. ---
const CROP_TEMPLATES_URL = 'Calendar/' + (_S.CROP_TEMPLATES_FILE || 'JamatAgro_CropTemplates_v3.json');
const CROP_CYCLES_URL    = _S.CROP_CYCLES_URL || 'Calendar/JamatAgro_CropCycles_v2.csv';
const TASK_LOG_URL       = _S.TASK_LOG_URL || 'Calendar/JamatAgro_TaskLog_v2.csv';
const PLANNER_URL        = 'Calendar/JamatAgro_PlanningViews_v4.html';

const ANCHOR=[7.242611,4.029740];
const map=L.map('map').setView(ANCHOR,16);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,attribution:'Esri'});
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'OSM'});
function setBase(){ map.removeLayer(sat); map.removeLayer(street);
  if(document.getElementById('ck_lite').checked) return;             // lite = no tiles
  (document.getElementById('ck_street').checked?street:sat).addTo(map); }
function liteChanged(){ if(document.getElementById('ck_lite').checked) document.getElementById('ck_see').checked=false; setBase(); }
function setFill(v){ FILL=v/100; render(); }
function seeThrough(){ const on=document.getElementById('ck_see').checked;
  if(on){ document.getElementById('ck_lite').checked=false; setBase();           // need imagery behind
    document.getElementById('fill').value=15; setFill(15); }
  else { document.getElementById('fill').value=80; setFill(80); } }
setBase();   // start in lite (no imagery); tick off Lite to load satellite

function toggleMenu(force){ const s=document.getElementById('side'), b=document.getElementById('backdrop');
  const open=(force===undefined)?!s.classList.contains('open'):force;
  s.classList.toggle('open',open); b.style.display=open?'block':'none';
  setTimeout(()=>map.invalidateSize(),260); }

const PALETTES={
  use:{prop:'current_use',colors:{'Oil palm':'#2e7d32','Arable':'#e0cfa0','Factory':'#fb8c00','Livestock':'#424242'},fb:'#bdbdbd'},
  vintage:{prop:'vintage_year',colors:{'2009':'#808a5a','2013 & 2017':'#7fd3e6','2018':'#ffd400','2021':'#ef9a9a','2024':'#9c27b0','2026':'#2962ff','2026 batch-2':'#e53935'},fb:'#cfcfcf'},
  cleared:{prop:'cleared_status',colors:{'Planted':'#2e7d32','Uncleared':'#d9a441'},fb:'#cfcfcf'},
  zone:{prop:'allocation_zone',colors:{'A':'#2e7d32','B':'#ffd400','C':'#8d6e63','D':'#424242'},fb:'#e0e0e0'},
  manager:{prop:'manager',colors:{},fb:'#90a4ae',dynamic:true}
};
const MGR_PAL=['#1565c0','#6a1b9a','#00897b','#c62828','#ef6c00','#5d4037'];
const INC_COL={Fire:'#e53935',Flood:'#1565c0',Pest:'#f0a500',Disease:'#f0a500',Theft:'#6a1b9a',Flood2:'#1565c0'};

let attr={}, activity=[], geoLayer=null, centroids={}, FILL=0.8;
const actLayer=L.layerGroup().addTo(map), incLayer=L.layerGroup().addTo(map);

/* ---- Farm Calendar overlay state + logic (read-only) ---- */
let CAL={}, calReady=false, TPL=null, CYC=null, TLOG=[];
const CAL_COLORS={red:'#c0392b',amber:'#e0a020',blue:'#1565c0',green:'#2e7d32',grey:'#9e9e9e'};
const CAL_LABEL={red:'Critical overdue',amber:'Task due this week',blue:'Harvest window open',green:'On track',grey:'No active cycle'};
function calToday(){ return new Date().toISOString().slice(0,10); }
function buildPlotUse(){ const u={}; for(const p in attr){ if(attr[p]&&attr[p].current_use) u[p]=attr[p].current_use; } return u; }
function computeCalendar(){
  if(!window.JamatCal||!TPL||!CYC||!Object.keys(centroids).length) return;
  const today=calToday(), plots=Object.keys(centroids);
  const res=JamatCal.generate({templates:TPL,cycles:CYC,taskLog:TLOG,plots:plots,plotUse:buildPlotUse(),today:today,
    rangeStart:JamatCal.iso(JamatCal.addDays(JamatCal.parseDate(today),-45)),
    rangeEnd:JamatCal.iso(JamatCal.addDays(JamatCal.parseDate(today),400))});
  const byPlot={}; res.occurrences.forEach(o=>{ (byPlot[o.plot_no]=byPlot[o.plot_no]||[]).push(o); });
  CAL={};
  Object.keys(byPlot).forEach(p=>{
    const open=byPlot[p].filter(o=>o.status!=='done'&&o.status!=='skipped');
    let color='grey';
    if(open.some(o=>o.status==='overdue')) color='red';
    else if(open.some(o=>o.status==='due_soon')) color='amber';
    else if(open.some(o=>o.type==='window'&&o.scheduled_date<=today&&o.end_date&&o.end_date>=today)) color='blue';
    else if(open.length) color='green';
    const next=open.sort((a,b)=>a.scheduled_date<b.scheduled_date?-1:1).slice(0,5);
    CAL[p]={color:color,label:CAL_LABEL[color],next:next};
  });
  calReady=true;
  if(mode()==='calendar') render();
}
function maybeCal(){ if(TPL&&CYC&&Object.keys(centroids).length) computeCalendar(); }
function loadCalendar(){
  if(typeof CROP_TEMPLATES_URL!=='undefined'&&CROP_TEMPLATES_URL) fetch(CROP_TEMPLATES_URL).then(r=>r.ok?r.json():Promise.reject()).then(j=>{ TPL=(j&&j.templates)||j; maybeCal(); }).catch(()=>{});
  if(typeof CROP_CYCLES_URL!=='undefined'&&CROP_CYCLES_URL) Papa.parse(CROP_CYCLES_URL,{download:true,header:true,skipEmptyLines:true,complete:r=>{ CYC=(r.data||[]).filter(x=>x.cycle_id); maybeCal(); },error:()=>{ CYC=CYC||[]; }});
  if(typeof TASK_LOG_URL!=='undefined'&&TASK_LOG_URL) Papa.parse(TASK_LOG_URL,{download:true,header:true,skipEmptyLines:true,complete:r=>{ TLOG=(r.data||[]).filter(x=>x.entry_id); maybeCal(); },error:()=>{}});
}

function colourFor(p){ if(mode()==='calendar'){ return (CAL[p]&&CAL_COLORS[CAL[p].color])||CAL_COLORS.grey; }
  const m=PALETTES[mode()]; const v=((attr[p]||{})[m.prop]||'').toString().trim();
  if(m.dynamic){ if(!v)return m.fb; if(!(v in m.colors))m.colors[v]=MGR_PAL[Object.keys(m.colors).length%MGR_PAL.length]; return m.colors[v]; }
  return m.colors[v]||m.fb; }
function mode(){ return document.getElementById('mode').value; }
function styleFor(f){ const c=colourFor(f.properties.plot_no); const see=FILL<0.35;
  return {color:see?c:'#fff',weight:see?2.6:1.4,fillColor:c,fillOpacity:FILL}; }
function popupHtml(p){ const a=attr[p]||{};
  const rows=[['Use',a.current_use],['Vintage',a.vintage_year],['Cropping',a.cropping_type],['Manager',a.manager],['Allocation',a.allocation_zone],['Status',a.cleared_status],['Notes',a.notes]]
    .filter(r=>r[1]).map(r=>`${r[0]}: ${r[1]}`).join('<br>');
  let cal='';
  const c=CAL[p];
  if(c){ const sw=`<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${CAL_COLORS[c.color]};margin-right:4px"></span>`;
    cal=`<hr style="margin:6px 0">${sw}<b>${c.label}</b>`+
      (c.next.length?('<br><span style="color:#555">Next tasks:</span><br>'+c.next.map(o=>`&nbsp;• ${calFmt(o.scheduled_date)} — ${o.field_label||o.label}${o.critical?' ‼':''}`).join('<br>')):'<br><i>no upcoming tasks</i>')+
      `<br><a href="${PLANNER_URL}?plot=${p}" target="_blank" rel="noopener">Open plot in planner ▸</a>`;
  } else if(calReady){ cal=`<hr style="margin:6px 0"><i>No active crop cycle</i>`; }
  return `<b>Plot ${p}</b><br>${rows||'<i>no attributes</i>'}${cal}`; }
function calFmt(iso){ if(!iso)return''; const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const q=iso.split('-'); return (+q[2])+' '+M[+q[1]-1]; }

function drawGeo(fc){
  if(geoLayer)map.removeLayer(geoLayer); centroids={};
  geoLayer=L.geoJSON(fc,{style:styleFor,onEachFeature:(f,l)=>{ const p=f.properties.plot_no;
    centroids[p]=l.getBounds().getCenter();
    l.bindPopup(()=>popupHtml(p)); l.bindTooltip(String(p),{permanent:true,direction:'center',className:'plotlabel'}); }}).addTo(map);
  try{ map.fitBounds(geoLayer.getBounds(),{padding:[20,20]}); }catch(e){}
  render();
  if(typeof maybeCal==='function') maybeCal();
}
function daysAgo(d){ const t=new Date(d).getTime(); if(isNaN(t))return 0; return (Date.now()-t)/86400000; }
// Map the Google Form's column names to the fields the map expects
function normActivity(row){ const o={}; for(const k in row) o[k.trim().toLowerCase()]=row[k];
  const pick=(...names)=>{ for(const n of names){ if(o[n])return o[n]; } for(const key in o){ for(const n of names){ if(key.indexOf(n)>=0 && o[key])return o[key]; } } return ''; };
  const detail=pick('detail'), severity=pick('severity'), type=pick('typ','type');
  const incSet=['fire','flood','pest','disease','theft'];
  const isInc = severity!=='' || incSet.includes((detail||'').toLowerCase()) || /incident|vorfall/i.test(type);
  return { plot_no:pick('plot_no','plot number','plot'), type:isInc?'Incident':'Work', detail:detail,
    severity:severity, date:pick('date')||pick('zeitstempel','timestamp'), by:pick('your name','by','name'), note:pick('note') }; }
function renderOps(){
  actLayer.clearLayers(); incLayer.clearLayers();
  const lim=+document.getElementById('days').value;
  const showAct=document.getElementById('ck_act').checked, showInc=document.getElementById('ck_inc').checked;
  activity.forEach(r=>{ const p=parseInt(r.plot_no); const c=centroids[p]; if(!c)return; if(daysAgo(r.date)>lim)return;
    if((r.type||'').toLowerCase()==='incident'){ if(!showInc)return;
      const col=INC_COL[(r.detail||'').trim()]||'#f0a500';
      L.circleMarker([c.lat+0.0002,c.lng+0.0002],{radius:8,color:'#fff',weight:2,fillColor:col,fillOpacity:1})
        .bindPopup(`<b>⚠ ${r.detail}</b>${r.note||''}<br>${r.severity||''} · ${r.date} · ${r.by||''}`).addTo(incLayer);
    }else{ if(!showAct)return;
      L.marker(c,{icon:L.divIcon({className:'',html:'<div style="background:#1a2b22;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff">✓</div>',iconSize:[20,20]})})
        .bindPopup(`<b>${r.detail}</b>Plot ${p}<br>${r.date} · ${r.by||''}`).addTo(actLayer);
    }});
}
function render(){ if(geoLayer)geoLayer.eachLayer(l=>l.setStyle(styleFor(l.feature))); buildLegend(); renderOps(); }
function buildLegend(){ if(mode()==='calendar'){ document.getElementById('legend').innerHTML=['red','amber','blue','green','grey'].map(k=>`<div class="legend-row"><span class="sw" style="background:${CAL_COLORS[k]}"></span>${CAL_LABEL[k]}</div>`).join('')+(calReady?'':'<div class="legend-row" style="color:#888">loading calendar…</div>'); return; }
  const m=PALETTES[mode()]; const present=new Set();
  Object.values(attr).forEach(a=>{const v=(a[m.prop]||'').toString().trim(); if(v)present.add(v);});
  let entries=m.dynamic?[...present]:Object.keys(m.colors).filter(k=>present.has(k)||Object.keys(attr).length===0);
  document.getElementById('legend').innerHTML=entries.map(k=>`<div class="legend-row"><span class="sw" style="background:${m.colors[k]||'#90a4ae'}"></span>${k}</div>`).join('')
    +`<div class="legend-row"><span class="sw" style="background:${m.fb}"></span>—/unknown</div>`; }
function findPlot(v){ v=parseInt(v); if(!geoLayer||isNaN(v))return; geoLayer.eachLayer(l=>{ if(l.feature.properties.plot_no===v){ map.fitBounds(l.getBounds(),{maxZoom:19}); l.openPopup(); }}); }

function loadGeom(file){ if(!file)return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const fc=j.type==='FeatureCollection'?j:(j.plots||null);
    if(!fc)return alert('Not a geometry/project file.'); drawGeo(fc);
    document.getElementById('hdr').textContent=fc.features.length+' plots loaded'; setStatus(); }catch(e){ alert('Could not read file.'); } }; r.readAsText(file); }
function loadCsv(file,kind){ if(!file)return; Papa.parse(file,{header:true,skipEmptyLines:true,complete:res=>applyCsv(res.data,kind)}); }
function applyCsv(rows,kind){ if(kind==='attr'){ attr={}; rows.forEach(r=>{const p=parseInt(r.plot_no); if(!isNaN(p))attr[p]=r;}); }
  else{ activity=rows.map(normActivity).filter(x=>x.plot_no); } render(); setStatus(); }
function setStatus(){ document.getElementById('status').textContent=
  Object.keys(attr).length+' attrs · '+activity.length+' log rows · '+(geoLayer?geoLayer.getLayers().length:0)+' plots'; }

// Placeholder grid of all 98 plots (until real geometry is traced/loaded)
function placeholderGrid(){ const f=[]; const cell=0.0007, sLat=ANCHOR[0]+0.0042, sLon=ANCHOR[1]-0.0035;
  for(let n=1;n<=98;n++){ const r=Math.floor((n-1)/10), c=(n-1)%10; const lat=sLat-r*cell, lon=sLon+c*cell, s=cell*0.9;
    f.push({type:'Feature',properties:{plot_no:n},geometry:{type:'Polygon',coordinates:[[[lon,lat],[lon+s,lat],[lon+s,lat-s],[lon,lat-s],[lon,lat]]]}}); }
  drawGeo({type:'FeatureCollection',features:f}); }

// live mode — draw the placeholder grid IMMEDIATELY so plots always show,
// then recolour it when the Register CSV arrives.
if(REGISTER_CSV_URL){
  placeholderGrid();
  document.getElementById('hdr').textContent='Live · placeholder grid (trace geometry for true plot shapes)';
  Papa.parse(REGISTER_CSV_URL,{download:true,header:true,skipEmptyLines:true,
    complete:r=>applyCsv(r.data,'attr'),
    error:()=>{ document.getElementById('status').textContent='⚠ Could not load Register sheet — check the published link.'; }});
}
if(ACTIVITY_CSV_URL) Papa.parse(ACTIVITY_CSV_URL,{download:true,header:true,skipEmptyLines:true,
  complete:r=>applyCsv(r.data,'act'), error:()=>{} });

// Auto-load the traced geometry from the repo (https). Replaces the placeholder grid.
if(GEOMETRY_URL){
  fetch(GEOMETRY_URL).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    const fc=j.type==='FeatureCollection'?j:(j.plots||null);
    if(fc && fc.features && fc.features.length){ drawGeo(fc);
      document.getElementById('hdr').textContent='Live · '+fc.features.length+' plots loaded from repo'; }
  }).catch(()=>{});   // fails silently offline (file://) → keeps placeholder / Load button
}

// Farm Calendar overlay — load cycles/templates/log from the repo (same-origin when hosted)
loadCalendar();

// demo on first open
function demo(){ const c=ANCHOR,f=[]; let n=1; const uses=[['Oil palm','2018'],['Oil palm','2009'],['Arable',''],['Factory',''],['Livestock',''],['Oil palm','2026']];
  for(let r=0;r<2;r++)for(let cc=0;cc<3;cc++){ const lat=c[0]+0.003-r*0.0016, lon=c[1]-0.003+cc*0.0016;
    f.push({type:'Feature',properties:{plot_no:n},geometry:{type:'Polygon',coordinates:[[[lon,lat],[lon+0.0014,lat],[lon+0.0014,lat-0.0014],[lon,lat-0.0014],[lon,lat]]]}});
    attr[n]={plot_no:n,current_use:uses[n-1][0],vintage_year:uses[n-1][1],manager:n<3?'Mr Hassan':'',cleared_status:uses[n-1][0]==='Arable'?'Uncleared':'Planted'}; n++; }
  activity=[{plot_no:1,type:'Work',detail:'Weeding',date:new Date().toISOString().slice(0,10),by:'Musa'},
            {plot_no:5,type:'Incident',detail:'Fire',severity:'Minor',date:new Date().toISOString().slice(0,10),by:'Crew',note:'Demo'}];
  drawGeo({type:'FeatureCollection',features:f}); setStatus(); }
if(!REGISTER_CSV_URL) demo();
</script>
